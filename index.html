<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flick Comet — Rhythm Game Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0dfd8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7c3aed;
    margin-bottom: 16px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 12px;
  }
  .stat {
    background: #13131a;
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .stat-label { font-size: 11px; color: #666; margin-bottom: 2px; }
  .stat-value { font-size: 20px; font-weight: 500; }
  .arena-wrap {
    width: 100%;
    max-width: 700px;
    border-radius: 12px;
    overflow: hidden;
    border: 0.5px solid rgba(255,255,255,0.08);
  }
  canvas {
    display: block;
    width: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 700px;
  }
  .controls label { font-size: 13px; color: #888; display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { width: 90px; accent-color: #7c3aed; }
  button {
    font-size: 13px;
    padding: 7px 18px;
    background: #1a1a2a;
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #e0dfd8;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #222235; }
  .legend {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 12px;
    width: 100%;
    max-width: 700px;
  }
  .leg {
    background: #13131a;
    border-radius: 8px;
    padding: 8px 10px;
    border-left: 3px solid;
  }
  .leg-label { font-size: 11px; color: #666; }
  .leg-pts   { font-size: 13px; font-weight: 500; margin: 2px 0; }
  .leg-desc  { font-size: 11px; color: #555; }
</style>
</head>
<body>

<h1>Flick Comet · Rhythm Prototype</h1>

<div class="stats">
  <div class="stat"><div class="stat-label">score</div><div class="stat-value" id="score-display">0</div></div>
  <div class="stat"><div class="stat-label">last flick</div><div class="stat-value" id="last-flick" style="font-size:16px;">—</div></div>
  <div class="stat"><div class="stat-label">flick direction</div><div class="stat-value" id="req-dir" style="font-size:15px;">—</div></div>
</div>

<div class="arena-wrap">
  <canvas id="arena"></canvas>
</div>

<div class="controls">
  <label>
    speed
    <input type="range" id="speed-sl" min="1" max="5" value="2" step="1">
    <span id="speed-val">2</span>
  </label>
  <button onclick="spawnComet()">launch comet</button>
  <button onclick="resetScore()">reset</button>
</div>

<div class="legend">
  <div class="leg" style="border-color:#22c55e;">
    <div class="leg-label">perfect</div>
    <div class="leg-pts" style="color:#22c55e;">+100</div>
    <div class="leg-desc">right dir, full brightness</div>
  </div>
  <div class="leg" style="border-color:#3b82f6;">
    <div class="leg-label">good</div>
    <div class="leg-pts" style="color:#3b82f6;">+50</div>
    <div class="leg-desc">close dir or near</div>
  </div>
  <div class="leg" style="border-color:#f59e0b;">
    <div class="leg-label">ok</div>
    <div class="leg-pts" style="color:#f59e0b;">+25</div>
    <div class="leg-desc">flicked while fading</div>
  </div>
  <div class="leg" style="border-color:#ef4444;">
    <div class="leg-label">wrong dir</div>
    <div class="leg-pts" style="color:#ef4444;">+10</div>
    <div class="leg-desc">bad angle</div>
  </div>
  <div class="leg" style="border-color:#333;">
    <div class="leg-label">miss</div>
    <div class="leg-pts" style="color:#666;">+0</div>
    <div class="leg-desc">exits unflicked</div>
  </div>
</div>

<script>
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const W = 680, H = 400;
canvas.width = W; canvas.height = H;

const FADE_START = 160;
const FADE_END   = 60;

const ENTRY_CONFIGS = [
  {name:'from top ↓',       sx:()=>W*0.25+Math.random()*W*0.5, sy:()=>-22, vx:0,  vy:1,    rx:0,  ry:-1,   reqLabel:'flick up ↑'},
  {name:'from top-left ↘',  sx:()=>-22,  sy:()=>-22,           vx:1,  vy:1,    rx:-1, ry:-1,   reqLabel:'flick ↖'},
  {name:'from top-right ↙', sx:()=>W+22, sy:()=>-22,           vx:-1, vy:1,    rx:1,  ry:-1,   reqLabel:'flick ↗'},
  {name:'from left →',      sx:()=>-22,  sy:()=>H*0.2+Math.random()*H*0.6, vx:1, vy:0, rx:-1, ry:0, reqLabel:'flick left ←'},
  {name:'from right ←',     sx:()=>W+22, sy:()=>H*0.2+Math.random()*H*0.6, vx:-1,vy:0, rx:1,  ry:0, reqLabel:'flick right →'},
  {name:'from top-left ↘',  sx:()=>-22,  sy:()=>H*0.05,        vx:1,  vy:0.55, rx:-1, ry:-0.55,reqLabel:'flick ↖'},
  {name:'from top-right ↙', sx:()=>W+22, sy:()=>H*0.05,        vx:-1, vy:0.55, rx:1,  ry:-0.55,reqLabel:'flick ↗'},
];

let comet = null, score = 0, flickDown = null, resultMsg = null;
let animId = null, lastTs = null, speedFactor = 2, spawnTimer = null;

function getFadeFraction(c) {
  const edgeDist = Math.min(c.x, W-c.x, c.y, H-c.y);
  if (edgeDist >= FADE_START) return 0;
  if (edgeDist <= FADE_END)   return 1;
  return 1 - (edgeDist - FADE_END) / (FADE_START - FADE_END);
}

function spawnComet() {
  if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
  const cfg = ENTRY_CONFIGS[Math.floor(Math.random() * ENTRY_CONFIGS.length)];
  const mag = Math.sqrt(cfg.vx*cfg.vx + cfg.vy*cfg.vy);
  comet = {
    x: cfg.sx(), y: cfg.sy(),
    vx: (cfg.vx/mag)*speedFactor*1.8,
    vy: (cfg.vy/mag)*speedFactor*1.8,
    r: 18, cfg, trail: [],
    flicked: false, flickVx: 0, flickVy: 0,
    flickColor: '#22c55e', alive: true,
    ripples: [], opacity: 1,
  };
  document.getElementById('req-dir').textContent = cfg.reqLabel;
  resultMsg = null;
}

function resetScore() {
  score = 0; comet = null; resultMsg = null;
  document.getElementById('score-display').textContent = '0';
  document.getElementById('last-flick').textContent = '—';
  document.getElementById('req-dir').textContent = '—';
  document.getElementById('last-flick').style.color = '#e0dfd8';
  spawnComet();
}

function getSVGPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = W/rect.width, sy = H/rect.height;
  const src = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
  return { x:(src.clientX-rect.left)*sx, y:(src.clientY-rect.top)*sy };
}

function angleDiff(a,b) { let d=((b-a+360)%360); if(d>180) d=360-d; return d; }

function evalFlick(fx,fy,ex,ey) {
  if (!comet||!comet.alive||comet.flicked) return;
  const dx=ex-fx, dy=ey-fy;
  const mag=Math.sqrt(dx*dx+dy*dy);
  if (mag<12) return;
  const flickAngle=Math.atan2(dy,dx)*180/Math.PI;
  const rx=comet.cfg.rx, ry=comet.cfg.ry;
  const rmag=Math.sqrt(rx*rx+ry*ry);
  const reqAngle=Math.atan2(ry/rmag,rx/rmag)*180/Math.PI;
  const diff=angleDiff(flickAngle,reqAngle);
  const distToComet=Math.sqrt((fx-comet.x)**2+(fy-comet.y)**2);
  const onComet=distToComet<comet.r*4;
  const isFading=getFadeFraction(comet)>0.15;

  let pts,label,color;
  if (isFading) {
    if (diff<35)      { pts=25; label='OK';        color='#f59e0b'; }
    else if (diff<65) { pts=15; label='OK';         color='#f59e0b'; }
    else              { pts=10; label='WRONG DIR';  color='#ef4444'; }
  } else {
    if (onComet&&diff<35)      { pts=100; label='PERFECT!';  color='#22c55e'; }
    else if (onComet&&diff<65) { pts=50;  label='GOOD';      color='#3b82f6'; }
    else if (!onComet&&diff<35){ pts=50;  label='GOOD';      color='#3b82f6'; }
    else if (onComet)          { pts=10;  label='WRONG DIR'; color='#ef4444'; }
    else                       { pts=10;  label='NEAR MISS'; color='#ef4444'; }
  }
  score+=pts;
  document.getElementById('score-display').textContent=score;
  document.getElementById('last-flick').textContent=label;
  document.getElementById('last-flick').style.color=color;
  const speed=Math.sqrt(comet.vx*comet.vx+comet.vy*comet.vy)*2.2;
  const fmag=Math.sqrt(dx*dx+dy*dy);
  comet.flicked=true; comet.flickColor=color;
  comet.flickVx=(dx/fmag)*speed; comet.flickVy=(dy/fmag)*speed;
  comet.opacity=1;
  comet.ripples=[{x:comet.x,y:comet.y,r:comet.r,alpha:1,color}];
  resultMsg={text:label,color,x:comet.x,y:comet.y-38,life:55};
}

canvas.addEventListener('mousedown', e=>{ flickDown=getSVGPos(e); });
canvas.addEventListener('mouseup',   e=>{ if(!flickDown) return; const p=getSVGPos(e); evalFlick(flickDown.x,flickDown.y,p.x,p.y); flickDown=null; });
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); flickDown=getSVGPos(e); },{passive:false});
canvas.addEventListener('touchend',  e=>{ e.preventDefault(); if(!flickDown) return; const p=getSVGPos(e); evalFlick(flickDown.x,flickDown.y,p.x,p.y); flickDown=null; },{passive:false});
document.getElementById('speed-sl').addEventListener('input',function(){ speedFactor=parseInt(this.value); document.getElementById('speed-val').textContent=this.value; });

function hexToRgb(h){ return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`; }

function drawArena() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0a0f';
  ctx.beginPath(); ctx.roundRect(0,0,W,H,12); ctx.fill();
  ctx.setLineDash([5,5]); ctx.lineWidth=0.8; ctx.strokeStyle='rgba(255,255,255,0.06)';
  [[0,0,W*0.45,H*0.45],[W,0,W*0.55,H*0.45],[W/2,0,W/2,H*0.35],[0,H*0.5,W*0.35,H*0.5],[W,H*0.5,W*0.65,H*0.5]].forEach(([x1,y1,x2,y2])=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); });
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.font='11px system-ui,sans-serif';
  ctx.textAlign='left';  ctx.fillText('entry ↘',6,15);
  ctx.textAlign='right'; ctx.fillText('entry ↙',W-6,15);
  ctx.textAlign='center';ctx.fillText('entry ↓',W/2,15);
  ctx.textAlign='left';  ctx.fillText('entry →',6,H/2-4);
  ctx.textAlign='right'; ctx.fillText('entry ←',W-6,H/2-4);

  if (comet&&!comet.flicked) {
    const ff=getFadeFraction(comet);
    if (ff>0.05) {
      ctx.strokeStyle=`rgba(245,158,11,${ff*0.6})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(2,2,W-4,H-4,10); ctx.stroke();
      if (ff>0.3) {
        ctx.globalAlpha=Math.min(1,ff*1.2);
        ctx.fillStyle='#f59e0b'; ctx.font='bold 13px system-ui,sans-serif';
        ctx.textAlign='center'; ctx.fillText('fading — OK only!',W/2,H-14);
        ctx.globalAlpha=1;
      }
    }
  }
}

function drawRipples() {
  if (!comet) return;
  comet.ripples=comet.ripples.filter(rp=>rp.alpha>0);
  comet.ripples.forEach(rp=>{
    const rgb=hexToRgb(rp.color.length===7?rp.color:'#22c55e');
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${rgb},${rp.alpha})`; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r*1.6,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${rgb},${rp.alpha*0.4})`; ctx.lineWidth=1.5; ctx.stroke();
    rp.r+=3.2; rp.alpha-=0.04;
  });
}

function drawComet() {
  if (!comet) return;
  ctx.globalAlpha=comet.opacity;
  const bodyColor=comet.flicked?comet.flickColor:'#7c3aed';
  comet.trail.push({x:comet.x,y:comet.y});
  if (comet.trail.length>26) comet.trail.shift();
  for (let i=0;i<comet.trail.length;i++) {
    const t=comet.trail[i], frac=i/comet.trail.length;
    ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(1,comet.r*frac*0.72),0,Math.PI*2);
    ctx.fillStyle=comet.flicked?comet.flickColor+Math.round(frac*150).toString(16).padStart(2,'0'):`rgba(124,58,237,${frac*0.42})`;
    ctx.fill();
  }
  if (!comet.flicked) {
    ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r*4,0,Math.PI*2);
    ctx.fillStyle='rgba(124,58,237,0.05)'; ctx.fill();
    ctx.strokeStyle='rgba(124,58,237,0.2)'; ctx.lineWidth=1;
    ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r+9,0,Math.PI*2);
  ctx.fillStyle=comet.flicked?comet.flickColor+'33':'rgba(124,58,237,0.15)'; ctx.fill();
  ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r,0,Math.PI*2);
  ctx.fillStyle=bodyColor; ctx.fill();
  ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r*0.4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.fill();
  if (!comet.flicked) {
    const rx=comet.cfg.rx,ry=comet.cfg.ry,rmag=Math.sqrt(rx*rx+ry*ry);
    const nx=rx/rmag,ny=ry/rmag,ax=comet.x+nx*36,ay=comet.y+ny*36;
    ctx.beginPath(); ctx.moveTo(comet.x+nx*10,comet.y+ny*10); ctx.lineTo(ax,ay);
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2.5; ctx.stroke();
    const ha=Math.atan2(ny,nx);
    ctx.beginPath();
    ctx.moveTo(ax,ay); ctx.lineTo(ax-9*Math.cos(ha-0.45),ay-9*Math.sin(ha-0.45));
    ctx.moveTo(ax,ay); ctx.lineTo(ax-9*Math.cos(ha+0.45),ay-9*Math.sin(ha+0.45));
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2.5; ctx.stroke();
  }
  if (comet.flicked&&comet.flickColor==='#22c55e') {
    ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r+15,0,Math.PI*2);
    ctx.strokeStyle='#22c55e'; ctx.lineWidth=2; ctx.globalAlpha=comet.opacity*0.55; ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawResult() {
  if (!resultMsg) return;
  ctx.globalAlpha=Math.min(1,resultMsg.life/16);
  ctx.font='bold 26px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillStyle=resultMsg.color; ctx.fillText(resultMsg.text,resultMsg.x,resultMsg.y);
  ctx.globalAlpha=1; resultMsg.y-=0.85; resultMsg.life--;
  if (resultMsg.life<=0) resultMsg=null;
}

function loop(ts) {
  if (!lastTs) lastTs=ts;
  const dt=Math.min(30,ts-lastTs); lastTs=ts;
  if (comet&&comet.alive) {
    if (comet.flicked) {
      comet.x+=comet.flickVx*dt*0.1; comet.y+=comet.flickVy*dt*0.1;
      comet.opacity=Math.max(0,comet.opacity-0.025);
    } else {
      comet.x+=comet.vx*dt*0.1; comet.y+=comet.vy*dt*0.1;
      comet.opacity=1-getFadeFraction(comet)*0.78;
    }
    if (comet.x<-55||comet.x>W+55||comet.y<-55||comet.y>H+55) {
      if (!comet.flicked) {
        document.getElementById('last-flick').textContent='MISS';
        document.getElementById('last-flick').style.color='#666';
        resultMsg={text:'MISS',color:'#666',x:W/2,y:H/2,life:50};
      }
      comet=null;
      spawnTimer=setTimeout(spawnComet,950);
    }
  }
  drawArena(); drawRipples(); drawComet(); drawResult();
  animId=requestAnimationFrame(loop);
}

animId=requestAnimationFrame(loop);
spawnComet();
</script>
</body>
</html>
